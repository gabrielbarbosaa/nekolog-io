name: nekolog-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nekolog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nekolog}
      POSTGRES_DB: ${POSTGRES_DB:-nekolog_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-nekolog_dev}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-nekolog}
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    ports:
      - "3900:3900" # S3-compatible API
      - "3903:3903" # Admin API
    volumes:
      - ./garage.dev.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  garage-init:
    image: curlimages/curl:8.11.1
    depends_on:
      garage:
        condition: service_healthy
    volumes:
      - ./garage-init.sh:/garage-init.sh:ro
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev-admin-token}
      R2_BUCKET: ${R2_BUCKET:-nekolog-dev}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-GK31c2f218a2e44f485b94239e}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-4420d5c5d6b0b5e6a1e1d8f3c2b7a9e0f1d2c3b4a5968778}
    entrypoint: ["/bin/sh", "/garage-init.sh"]

volumes:
  postgres_data:
  clickhouse_data:
  garage_meta:
  garage_data:
