# Regras do ZAP tratadas de outro jeito na ingestão.
# Formato: <id><TAB>WARN|FAIL|IGNORE<TAB><nome da regra>
#
# 90004 — Cross-Origin-Resource-Policy ausente.
# A ingestão não manda esse header de propósito. O corpo da resposta é
# {"accepted":N,"rejected":[]}: não há nada para proteger de embutimento
# cross-origin. Em troca, é a única rota com cliente de navegador, e a saída por
# navigator.sendBeacon acontece durante o unload da página e não pode ser
# retentada. Benefício zero contra risco não-zero no único caminho sem segunda
# chance. A API pública manda o header, porque lá o corpo é o log de um tenant.
90004	IGNORE	Cross-Origin-Resource-Policy Header Missing or Invalid
#
# 10049 — conteúdo armazenável e cacheável, só nos 404 de / e /robots.txt.
# A ingestão não serve página; esses dois endereços não existem e a resposta é o
# corpo de erro padrão. Não há dado de ninguém para um cache guardar.
10049	IGNORE	Storable and Cacheable Content
#
# 10106 — site só em HTTP.
# Artefato da varredura local: ela roda contra a entrada Node em
# http://localhost. Na nuvem a ingestão só existe num hostname da zona criado
# pelo OpenTofu, atrás do TLS da Cloudflare, e `workers_dev` é falso nos três
# ambientes (ameaça E15). No self-host, o guia manda pôr um proxy reverso com
# certificado na frente. Se esta regra aparecer numa varredura contra `qa` ou
# produção, é achado de verdade.
10106	IGNORE	HTTP Only Site
