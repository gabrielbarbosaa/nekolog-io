name: Backup

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      restore_test:
        description: Restore the newest backup into a throwaway database and check it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dump:
    name: Dump, encrypt and upload
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client age

      - name: Refuse to run without a recipient
        run: test -n "${AGE_RECIPIENT:-}"
        env:
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}

      - name: Dump, compress and encrypt
        run: |
          set -euo pipefail
          key="$(node internal/backup/src/cli.ts key --environment prod)"
          echo "key=$key" >> "$GITHUB_ENV"
          pg_dump --no-owner --no-privileges --format=plain \
            | gzip --best --stdout \
            | age --recipient "$AGE_RECIPIENT" > backup.age
          test -s backup.age
        env:
          PGDATABASE: ${{ secrets.DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}

      - name: Refuse to upload something that is not encrypted
        run: |
          set -euo pipefail
          head -c 16 backup.age | grep -q 'age-encryption.org'

      - name: Upload to R2
        run: |
          set -euo pipefail
          aws s3 cp backup.age "s3://$BUCKET/$key" --endpoint-url "$ENDPOINT"
        env:
          BUCKET: ${{ vars.BACKUP_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Delete what is past the retention
        run: |
          set -euo pipefail
          aws s3 ls "s3://$BUCKET/postgres/" --recursive --endpoint-url "$ENDPOINT" \
            | awk '{print $4}' > stored.txt
          node internal/backup/src/cli.ts expired --keys-file stored.txt --keep-days "$KEEP_DAYS" > doomed.txt
          while read -r old; do
            test -n "$old" || continue
            aws s3 rm "s3://$BUCKET/$old" --endpoint-url "$ENDPOINT"
          done < doomed.txt
        env:
          BUCKET: ${{ vars.BACKUP_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_ENDPOINT }}
          KEEP_DAYS: ${{ vars.BACKUP_KEEP_DAYS || '30' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

  restore:
    name: Restore the newest backup and check it
    needs: dump
    if: vars.BACKUPS_ENABLED == 'true' && inputs.restore_test
    runs-on: ubuntu-latest
    environment: prod
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: nekolog
          POSTGRES_PASSWORD: nekolog
          POSTGRES_DB: restored
        options: >-
          --health-cmd "pg_isready -U nekolog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client age

      - name: Fetch the newest backup
        run: |
          set -euo pipefail
          newest="$(aws s3 ls "s3://$BUCKET/postgres/prod/" --endpoint-url "$ENDPOINT" \
            | sort | tail -n 1 | awk '{print $4}')"
          test -n "$newest"
          aws s3 cp "s3://$BUCKET/postgres/prod/$newest" backup.age --endpoint-url "$ENDPOINT"
        env:
          BUCKET: ${{ vars.BACKUP_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Restore it into the throwaway database
        run: |
          set -euo pipefail
          printf '%s' "$AGE_IDENTITY" > identity.key
          chmod 600 identity.key
          age --decrypt --identity identity.key < backup.age \
            | gunzip --stdout \
            | psql --quiet --no-psqlrc --set ON_ERROR_STOP=1
          rm -f identity.key
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          PGDATABASE: postgres://nekolog:nekolog@localhost:5432/restored

      - name: A restore nobody checked is not a backup
        run: |
          set -euo pipefail
          for table in users organizations memberships invites projects environments api_keys audit_log email_suppressions; do
            psql --quiet --no-psqlrc --set ON_ERROR_STOP=1 \
              --command "select 1 from $table limit 1" > /dev/null
            echo "$table restored"
          done
        env:
          PGDATABASE: postgres://nekolog:nekolog@localhost:5432/restored
