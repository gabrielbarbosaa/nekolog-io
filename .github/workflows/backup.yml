name: Backup restore test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  restore:
    name: Restore the newest backup and check it
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: nekolog
          POSTGRES_PASSWORD: nekolog
          POSTGRES_DB: restored
        options: >-
          --health-cmd "pg_isready -U nekolog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client age

      - name: Fetch the newest backup
        run: |
          set -euo pipefail
          newest="$(aws s3 ls "s3://$BUCKET/postgres/$ENVIRONMENT/" --endpoint-url "$ENDPOINT" \
            | sort | tail -n 1 | awk '{print $4}')"
          test -n "$newest"
          aws s3 cp "s3://$BUCKET/postgres/$ENVIRONMENT/$newest" backup.age --endpoint-url "$ENDPOINT"
        env:
          BUCKET: ${{ vars.BACKUP_BUCKET }}
          ENDPOINT: ${{ vars.BACKUP_ENDPOINT }}
          ENVIRONMENT: ${{ vars.BACKUP_ENVIRONMENT || 'prod' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Refuse to restore something that is not encrypted
        run: |
          set -euo pipefail
          head -c 16 backup.age | grep -q 'age-encryption.org'

      - name: Restore it into the throwaway database
        run: |
          set -euo pipefail
          printf '%s' "$AGE_IDENTITY" > identity.key
          chmod 600 identity.key
          age --decrypt --identity identity.key < backup.age \
            | gunzip --stdout \
            | psql --quiet --no-psqlrc --set ON_ERROR_STOP=1
          rm -f identity.key
        env:
          AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nekolog
          PGPASSWORD: nekolog
          PGDATABASE: restored

      - name: A restore nobody checked is not a backup
        run: |
          set -euo pipefail
          for table in users organizations memberships invites projects environments api_keys audit_log email_suppressions; do
            psql --quiet --no-psqlrc --set ON_ERROR_STOP=1 \
              --command "select 1 from $table limit 1" > /dev/null
            echo "$table restored"
          done
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nekolog
          PGPASSWORD: nekolog
          PGDATABASE: restored
