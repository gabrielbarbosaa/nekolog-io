name: Workers

on:
  pull_request:
    paths:
      - "apps/ingest/**"
      - "apps/jobs/**"
      - "internal/**"
      - "packages/**"
      - "deploy/workers/**"
      - ".github/workflows/deploy-workers.yml"
  push:
    branches: [main, qa, dev]
    paths:
      - "apps/ingest/**"
      - "apps/jobs/**"
      - "internal/**"
      - "packages/**"
      - "deploy/workers/**"
      - ".github/workflows/deploy-workers.yml"

permissions:
  contents: read

concurrency:
  group: workers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Bundle (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ingest, jobs]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render and compile every environment
        run: |
          set -euo pipefail
          for environment in dev qa prod; do
            echo "::group::$environment"
            node internal/deploy/src/render-cli.ts \
              --config "apps/$APP/wrangler.json" \
              --environment "$environment" \
              --out "apps/$APP/wrangler.generated.json"
            pnpm --filter "@apps/$APP" deploy:dry-run -- \
              --config wrangler.generated.json --env "$environment"
            echo "::endgroup::"
          done
        env:
          APP: ${{ matrix.app }}
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
          KV_NAMESPACE_ID: 00000000000000000000000000000000
          SPOOL_BUCKET: nekolog-spool-dry-run
          CLICKHOUSE_URL: https://clickhouse.invalid
          JOBS_VERSION: ${{ github.sha }}

  deploy:
    name: Deploy ${{ matrix.app }} (${{ github.ref_name }})
    needs: bundle
    if: github.event_name == 'push' && vars.WORKERS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app: [ingest, jobs]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Name the environment this branch deploys to
        id: target
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            dev)  echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
            qa)   echo "environment=qa" >> "$GITHUB_OUTPUT" ;;
            main) echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "This branch deploys nothing." && exit 1 ;;
          esac

      - name: Render the configuration with this environment's values
        run: |
          set -euo pipefail
          node internal/deploy/src/render-cli.ts \
            --config "apps/$APP/wrangler.json" \
            --environment "$ENVIRONMENT" \
            --out "apps/$APP/wrangler.generated.json"
        env:
          APP: ${{ matrix.app }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          SPOOL_BUCKET: ${{ vars.R2_SPOOL_BUCKET }}
          CLICKHOUSE_URL: ${{ vars.CLICKHOUSE_URL }}
          JOBS_VERSION: ${{ github.sha }}

      - name: Deploy
        run: |
          set -euo pipefail
          pnpm --filter "@apps/$APP" exec wrangler deploy \
            --config wrangler.generated.json --env "$ENVIRONMENT"
        env:
          APP: ${{ matrix.app }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload the secrets this app declares
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/secrets-$APP.json"
          trap 'rm -f "$file"' EXIT
          printf '%s' "$ALL_SECRETS" | node internal/deploy/src/secrets-cli.ts \
            --app "$APP" --out "$file"
          pnpm --filter "@apps/$APP" exec wrangler secret bulk "$file" \
            --config wrangler.generated.json --env "$ENVIRONMENT"
        env:
          APP: ${{ matrix.app }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ask the ingestion whether it came up with everything it needs
        if: matrix.app == 'ingest'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "https://$INGEST_HOSTNAME/health"; then
              echo
              exit 0
            fi
            echo "$INGEST_HOSTNAME did not answer yet (attempt $attempt)."
            sleep 10
          done
          echo "The Worker deployed but nobody answers on https://$INGEST_HOSTNAME/health."
          echo "If this is the first deploy, the custom domain is created by infra/envs/$ENVIRONMENT."
          exit 1
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          INGEST_HOSTNAME: ${{ vars.INGEST_HOSTNAME }}
