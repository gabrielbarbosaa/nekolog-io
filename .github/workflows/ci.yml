name: CI

on:
  pull_request:
  push:
    branches: [main, qa, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8-alpine
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: nekolog
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 60s
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: nekolog
          POSTGRES_PASSWORD: nekolog
          POSTGRES_DB: nekolog_dev
        options: >-
          --health-cmd "pg_isready -U nekolog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.28
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Start the object store
        run: |
          network=$(docker network ls --filter name=github_network --format '{{.Name}}' | head -n 1)
          if [ -z "$network" ]; then
            echo "No service network to attach Garage to; ClickHouse could not reach it." >&2
            exit 1
          fi
          docker run -d --name garage --network "$network" --network-alias garage \
            -p 3900:3900 -p 3903:3903 \
            -v "$PWD/deploy/garage.dev.toml:/etc/garage.toml:ro" \
            dxflrs/garage:v2.1.0
          for _ in $(seq 1 40); do
            if curl -sf -H "Authorization: Bearer ${GARAGE_ADMIN_TOKEN}" \
              "${GARAGE_ADMIN_URL}/v2/GetClusterStatus" > /dev/null; then
              break
            fi
            sleep 2
          done
          sh deploy/garage-init.sh
        env:
          GARAGE_ADMIN_URL: http://localhost:3903
          GARAGE_ADMIN_TOKEN: dev-admin-token
          R2_BUCKET: nekolog-dev
          R2_ACCESS_KEY_ID: GK31c2f218a2e44f485b94239e
          R2_SECRET_ACCESS_KEY: b0e7a4c21d8f5639ae0c47b2f81d3a6950c8e2b47f1a9d3c6e05b8a2f47c91d3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Lint (packages)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Bill of materials
        run: pnpm run release:sbom

      - name: Test
        run: pnpm run test
        env:
          WEB_HEADERS_TEST_REQUIRED: "1"
          DASHBOARD_HEADERS_TEST_REQUIRED: "1"
          DOCS_HEADERS_TEST_REQUIRED: "1"
          CLICKHOUSE_TEST_REQUIRED: "1"
          CLICKHOUSE_TEST_URL: http://localhost:8123
          CLICKHOUSE_TEST_USER: default
          CLICKHOUSE_TEST_PASSWORD: nekolog
          POSTGRES_TEST_REQUIRED: "1"
          POSTGRES_TEST_URL: postgres://nekolog:nekolog@localhost:5432/nekolog_dev
          REDIS_TEST_REQUIRED: "1"
          REDIS_TEST_URL: redis://localhost:6379
          MAILPIT_TEST_REQUIRED: "1"
          MAILPIT_TEST_URL: http://localhost:8025
          SMTP_TEST_URL: smtp://localhost:1025
          BACKUP_S3_TEST_REQUIRED: "1"
          BACKUP_S3_TEST_PROBE: http://localhost:3900
          BACKUP_S3_TEST_ENDPOINT: http://garage:3900/nekolog-dev
          BACKUP_S3_TEST_ACCESS_KEY: GK31c2f218a2e44f485b94239e
          BACKUP_S3_TEST_SECRET: b0e7a4c21d8f5639ae0c47b2f81d3a6950c8e2b47f1a9d3c6e05b8a2f47c91d3
          EXPORT_S3_TEST_REQUIRED: "1"
          EXPORT_S3_TEST_ENDPOINT: http://garage:3900/nekolog-dev
          EXPORT_S3_TEST_ACCESS_KEY: GK31c2f218a2e44f485b94239e
          EXPORT_S3_TEST_SECRET: b0e7a4c21d8f5639ae0c47b2f81d3a6950c8e2b47f1a9d3c6e05b8a2f47c91d3
          FUZZ_RUNS: "1000"
