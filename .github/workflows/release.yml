name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, because every package publishes its dist and nothing else
        run: pnpm build

      - name: Write and check one SBOM per published package
        run: pnpm run release:sbom

      - name: Create the Version Packages PR, or publish what it merged
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm run version-packages
          publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm run release' || '' }}
          createGithubReleases: true
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach each package's bill of materials to its own release
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          node internal/release/src/cli.ts --json > sboms.json
          echo "$PUBLISHED" | jq -c '.[]' | while read -r package; do
            name="$(echo "$package" | jq -r '.name')"
            version="$(echo "$package" | jq -r '.version')"
            file="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .file' sboms.json)"
            test -n "$file"
            gh release upload "$name@$version" "sbom/$file" --clobber
          done
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
