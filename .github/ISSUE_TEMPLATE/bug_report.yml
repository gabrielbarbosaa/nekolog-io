name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Issues in pt-BR or es are welcome too.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected package, app, or area
      placeholder: "e.g. @nekolog-io/node, apps/ingest, dashboard Explorer"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Environment and additional context
      placeholder: SDK/app version, runtime (Node/Bun/Deno/browser), OS, logs...
    validations:
      required: false
